[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kagiana"
version = "0.1.0"
description = "Pharmacophore screening CLI (2D / 3D) with multicore and GPU acceleration"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "rdkit>=2023.9.1",
    "pandas>=2.0",
    "numpy>=1.24",
    "tqdm>=4.65",
]

[project.optional-dependencies]
gpu = ["nvmolkit", "torch"]
dev = ["pytest>=7.4"]

[project.scripts]
kagiana = "kagiana.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kagiana"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires a CUDA GPU and nvmolkit"]
